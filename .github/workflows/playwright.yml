# Environment variables can be overridden via GitHub repository secrets:
#   BASE_URL       — Application URL (default: https://www.demoblaze.com)
#   TEST_TIMEOUT   — Test timeout in ms (default: 60000)
#   EXPECT_TIMEOUT — Assertion timeout in ms (default: 15000)
#   RETRIES        — Number of retries on failure (default: 2)
#   HEADLESS       — Always true in CI

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - browser: firefox
            allow-failure: true
          - browser: webkit
            allow-failure: true
    continue-on-error: ${{ matrix.allow-failure || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://www.demoblaze.com' }}
          TEST_TIMEOUT: ${{ secrets.TEST_TIMEOUT || '60000' }}
          EXPECT_TIMEOUT: ${{ secrets.EXPECT_TIMEOUT || '15000' }}
          RETRIES: ${{ secrets.RETRIES || '2' }}
          HEADLESS: 'true'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/
          retention-days: 7

      - name: Upload test traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
